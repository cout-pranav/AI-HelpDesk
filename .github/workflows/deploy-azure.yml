# Builds the React frontend into the API's wwwroot and deploys both to Azure App Service (Linux, .NET 10).
# Needs repo secrets AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (OIDC federated credential
# for this repo's main branch), optional VITE_SENTRY_DSN, and the repo variable AZURE_WEBAPP_NAME.
# App settings (connection string, JWT key, API keys) live on the Web App, not here.

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

      # Empty base URL: the app calls relative /api/... on the origin that served it. Process env wins
      # over the committed frontend/.env. VITE_GEMINI_API_KEY is deliberately not passed: it would be
      # public in the bundle.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish backend with the frontend in wwwroot
        run: |
          dotnet publish backend/TicketManagement.Api/TicketManagement.Api.csproj -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r frontend/dist/. publish/wwwroot/

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Azure logout
        if: always()
        run: az logout
