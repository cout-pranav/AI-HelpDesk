# Runs the app image against SQL Server in a container (LocalDB isn't reachable from Docker).
# Copy .env.example to .env and fill it in, then: docker compose up --build
# App: http://localhost:${APP_PORT} (default 8080)

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      args:
        VITE_GEMINI_API_KEY: ${VITE_GEMINI_API_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    image: ticket-management:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TicketManagementDb: Server=db;Database=TicketManagementDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
      SeedAdmin__DisplayName: ${SEED_ADMIN_DISPLAY_NAME:-Administrator}
      InboundEmail__Secret: ${INBOUND_EMAIL_SECRET:-}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      Sentry__Dsn: ${SENTRY_DSN:-}
    restart: unless-stopped

volumes:
  sqldata:
